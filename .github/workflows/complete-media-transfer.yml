name: Complete local media migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original images and videos
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            '7b1559_9121a27ad2fe4553bd3db7c55c31fa0b~mv2.png' \
            '7b1559_f59fbd433761009d92013df365e929c5.jpg' \
            '7b1559_ce48e7696bde2a6404687b340dcfe117.jpg' \
            '7b1559_faa09e7583ae49f9b1c5c48652948bb2~mv2.jpg' \
            '7b1559_eb56c51905234ca0a394e6b2f65445e4.png' \
            '7b1559_ed5eb2b6fef51185892df128bd7c5412.jpg' \
            '7b1559_df0c188d2df1431fa4d3ebe5e87f2920~mv2.jpg' \
            '7b1559_d6b05687ad994d9ea5dc3c3ac0810d38~mv2.jpg' \
            '7b1559_e1d0919e76094a08ae9fefea7cd3f7b3~mv2.jpg' \
            '7b1559_8151787a36694991a3963b67b336c078f002.jpg' \
            '7b1559_8e6695c0eef9428e86892ce49483b032f002.jpg' \
            '7b1559_8027d911cd41422e8e1d2ce3534d2d94.jpg' \
            '7b1559_1d631a0abd2645d3895b1ce4d132876b~mv2.png' \
            '7b1559_24b6edef76a24527af94e23b6c459335~mv2.jpg' \
            '7b1559_1014b7f9142b4ae8b80127f9d09a3a13~mv2.jpg' \
            '7b1559_14eef9a8cb7c4e5d97e9f35e5b6855a7~mv2.jpg'
          do
            curl --fail --location --retry 3 --silent --show-error \
              "https://static.wixstatic.com/media/${file}" \
              --output "assets/${file}"
          done

          mkdir -p assets/videos
          curl --fail --location --retry 3 --silent --show-error \
            'https://video.wixstatic.com/video/7b1559_025cbd79511b40558742803cafa303f7/720p/mp4/file.mp4' \
            --output assets/videos/vim-power-flyer.mp4
          curl --fail --location --retry 3 --silent --show-error \
            'https://video.wixstatic.com/video/7b1559_a81a47b887584d55bde2912bbb2aacbd/720p/mp4/file.mp4' \
            --output assets/videos/herzliya-loves-animals.mp4

      - name: Apply code changes
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | git apply -

      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          node --check js/site.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/site-content.json").read_text())
          refs = []

          def walk(value):
              if isinstance(value, list):
                  for item in value:
                      walk(item)
              elif isinstance(value, dict):
                  for item in value.values():
                      walk(item)
              elif isinstance(value, str) and value.startswith("assets/"):
                  refs.append(value)

          walk(data)
          missing = sorted({ref for ref in refs if not Path(ref).exists()})
          if missing:
              raise SystemExit(f"Missing media: {missing}")
          print(f"Verified {len(set(refs))} media references")
          PY
          ! grep -R -E 'https?://(static|video)\.wixstatic\.com' -- data js scripts
          test "$(stat -c %s assets/videos/vim-power-flyer.mp4)" -gt 20000000
          test "$(stat -c %s assets/videos/herzliya-loves-animals.mp4)" -gt 40000000

          git config user.name 'AviRambo54'
          git config user.email '160789414+AviRambo54@users.noreply.github.com'
          git rm -- .github/workflows/complete-media-transfer.yml
          git add -A
          git commit -m 'Store remaining media locally and verify contact form'
          git push
