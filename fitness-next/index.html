  <style>
:root {
  color-scheme: dark;
  --bg:#090a10; --surface:#15161d; --surface2:#1c1c26; --surface3:#22232e;
  --line:#30303c; --muted:#a2a3b3; --soft:#dadbe4; --text:#f9f9fc;
  --lime:#c8ff48; --purple:#bc62f6; --purple2:#8b39d1; --purple-soft:#271b32;
  --radius:20px; --safe-bottom:env(safe-area-inset-bottom,0px);
}
* {box-sizing:border-box}
html {scroll-behavior:smooth}
body {margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Hebrew","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select {font:inherit}
button {cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled {cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible {outline:2px solid var(--lime);outline-offset:3px}
button,input {touch-action:manipulation}
button {border:0}
.ambient {position:fixed;pointer-events:none;filter:blur(70px);opacity:.32;z-index:0;border-radius:50%}
.ambient-one {top:5%;left:calc(50% + 280px);width:230px;height:230px;background:#612295}
.ambient-two {bottom:12%;right:calc(50% + 275px);width:150px;height:150px;background:#5d6e16}
.app-shell {position:relative;z-index:1;max-width:510px;min-height:100dvh;margin:0 auto;background:linear-gradient(160deg,#101017 0,#090a0f 35%,#0b0c12 100%);padding:0 19px calc(118px + var(--safe-bottom));overflow-x:hidden}
.app-header {position:relative;height:78px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #23232e;margin-bottom:26px}
.brand-wrap {display:flex;align-items:center;gap:8px;direction:ltr}
.brand-mark {width:34px;height:30px;display:grid;place-items:center;color:var(--purple)}
.brand-text {line-height:.87;letter-spacing:-.7px;font-weight:950;font-size:22px;direction:ltr;font-style:italic}
.brand-text b {display:block;color:var(--purple);font-size:18px;margin-inline-start:22px}
.header-end {display:flex;align-items:center;gap:8px}
.header-pill {font-size:10px;font-weight:800;letter-spacing:1px;color:var(--lime);background:#1b2520;padding:8px 10px;border:1px solid #30432b;border-radius:99px;direction:ltr}
.circle-button {width:39px;height:39px;border-radius:13px;background:#1b1c24;color:var(--soft);display:grid;place-items:center;border:1px solid #333440}
.circle-button:hover {background:#272632}
.back-link {display:inline-flex;gap:7px;align-items:center;background:none;color:var(--muted);font-size:13px;padding:8px 0}
.small-label,.eyebrow {font-size:11px;font-weight:900;letter-spacing:1.65px;direction:ltr;color:var(--lime)}
.eyebrow.purple {color:#dc9fff}
.page-title {font-size:34px;line-height:1.14;letter-spacing:-1.35px;margin:9px 0 9px;font-weight:900}
.page-intro {color:var(--muted);font-size:14px;line-height:1.65;margin:0}
.h1-hero {font-size:37px;line-height:1.1;letter-spacing:-1.4px;margin:10px 0 5px}
.h1-hero span {color:var(--lime)}
.section-head {display:flex;justify-content:space-between;align-items:center;gap:10px;margin:29px 0 13px}
.section-head h2 {font-size:21px;letter-spacing:-.7px;margin:0;font-weight:900}
.text-action {background:transparent;color:var(--lime);font-size:12px;font-weight:800;padding:8px 2px;white-space:nowrap}
.text-action.purple {color:var(--purple)}
.section-sub {font-size:13px;color:var(--muted);margin:-5px 0 13px}

.btn {display:inline-flex;justify-content:center;align-items:center;gap:9px;padding:13px 19px;border-radius:13px;border:1px solid transparent;background:var(--lime);color:#131510;font-size:14px;font-weight:900;min-height:47px;transition:filter .2s,transform .12s;text-align:center}
.btn:active {transform:scale(.98)}
.btn:hover {filter:brightness(1.06)}
.btn:disabled {filter:grayscale(.5)}
.btn-purple {background:linear-gradient(110deg,#a736f3,#7f31d1);color:white;border-color:#bb69ff}
.btn-muted {background:#262631;color:var(--text);border-color:#393846}
.btn-outline {background:transparent;border-color:#45434f;color:var(--text)}
.btn-quiet {background:#22222b;color:var(--muted)}
.btn-block {display:flex;width:100%}
.btn-small {min-height:35px;padding:8px 11px;font-size:12px;border-radius:10px}
.hero .btn {min-width:179px}
.metrics {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 5px}
.metric {padding:16px 8px 14px;background:var(--surface);border:1px solid #292a35;border-radius:17px;text-align:center}
.metric strong {display:block;direction:ltr;font-size:23px;letter-spacing:-1px;white-space:nowrap}
.metric span {display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.metric svg {color:var(--purple)}
.card {background:linear-gradient(150deg,#1b1b25,#14161d);border:1px solid #30303a;border-radius:19px;overflow:hidden}
.card + .card {margin-top:10px}
.card-pad {padding:17px}
.feature-card {display:flex;align-items:center;gap:13px;padding:11px;margin-top:13px}
.feature-photo {flex:0 0 91px;width:91px;height:97px;object-fit:cover;object-position:center 44%;border-radius:13px}
.feature-body {flex:1;min-width:0}
.feature-title {font-size:16px;font-weight:900;margin-bottom:6px}
.mini-copy {font-size:12px;line-height:1.6;color:var(--muted)}
.inline-link {margin-top:11px;display:inline-flex;align-items:center;gap:5px;background:none;padding:0;color:var(--lime);font-size:12px;font-weight:850}
.category-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.category {text-align:right;padding:15px 13px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(150deg,#27202f,#161820);border:1px solid #36303c;border-radius:16px;color:var(--text)}
.category:nth-child(2) {background:linear-gradient(150deg,#202938,#161820)}
.category:nth-child(3) {background:linear-gradient(150deg,#2a2820,#161820)}
.category .category-icon {font-size:24px;line-height:1;color:var(--purple)}
.category:nth-child(3) .category-icon {color:var(--lime)}
.category strong {font-size:13px}
.plan-card {padding:18px;margin-top:12px}
.plan-card-top {display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.plan-name {font-size:23px;font-weight:900;direction:ltr;text-align:right;letter-spacing:-.5px}
.plan-sub {font-size:12px;color:var(--muted);margin-top:7px;line-height:1.6}
.plan-number {background:#282134;color:#dda6ff;border:1px solid #4e3561;border-radius:8px;padding:7px 9px;font-size:11px;white-space:nowrap}
.plan-badges {display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}
.data-chip {border:1px solid #393841;background:#24242d;color:#c0bfca;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.data-chip.green {background:#20291e;color:var(--lime);border-color:#36452c}
.data-chip.purple {background:#2c203a;color:#e0b2ff;border-color:#5a3677}
.flex {display:flex;align-items:center;gap:10px}
.flex.between {justify-content:space-between}
.flex.wrap {flex-wrap:wrap}
.flex.grow > * {flex:1}
.spacer {flex:1}
.mt-8 {margin-top:8px}.mt-12 {margin-top:12px}.mt-18 {margin-top:18px}.mt-24 {margin-top:24px}
.notice {font-size:12px;line-height:1.7;color:#b9b6c6;border:1px solid #43324f;background:#201a29;padding:12px 13px;border-radius:11px;margin:13px 0}
.notice strong {color:#e5c8fa}
.segmented {display:flex;gap:7px;padding:4px;background:#1a1a22;border-radius:13px;margin-top:20px;overflow:auto;scrollbar-width:none}
.seg {flex:1;white-space:nowrap;color:#a7a5b2;background:none;border-radius:10px;padding:11px;font-size:12px;font-weight:850}
.seg.active {color:#160d1b;background:var(--lime)}
.field {background:#20202a;border:1px solid #3b3a47;border-radius:13px;color:#fff;padding:12px 13px;min-height:46px;width:100%;outline:none;min-width:0}
.field:focus {border-color:var(--purple)}
.field::placeholder {color:#898797}
.search-wrap {position:relative;margin-top:18px}
.search-wrap .field {padding-right:41px}
.search-wrap svg {position:absolute;right:14px;top:13px;color:#9492a6}
.chips {display:flex;gap:7px;overflow-x:auto;padding:8px 0 13px;scrollbar-width:none;margin-top:12px}
.chips::-webkit-scrollbar {display:none}
.chip {border-radius:99px;flex:0 0 auto;background:#20212b;border:1px solid #33343e;padding:9px 14px;color:#bfc0c9;font-size:12px;font-weight:750}
.chip.active {background:var(--lime);border-color:var(--lime);color:#11150c}
.exercise-list {display:grid;gap:10px;margin-top:11px}
.ex-row {width:100%;display:flex;align-items:center;text-align:right;gap:12px;background:var(--surface);border:1px solid #30313d;border-radius:17px;padding:9px;color:var(--text);min-width:0}
.ex-thumb {flex:0 0 77px;width:77px;height:76px;display:grid;place-items:center;background:radial-gradient(ellipse at top,#44305a,#21232e 70%);border-radius:12px;overflow:hidden;color:#ba9bdf}
.ex-thumb img {width:100%;height:100%;object-fit:cover;object-position:48% 45%}
.ex-thumb svg {width:34px;height:34px;stroke-width:1.4}
.ex-info {min-width:0;flex:1}
.ex-info strong {display:block;font-size:15px;margin-bottom:5px;font-weight:900}
.ex-info small {font-size:11px;color:var(--muted);line-height:1.5}
.ex-info .mock-label {display:block;color:#c4a1df;font-size:10px;margin-top:5px}
.icon-btn {flex:0 0 37px;width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:#24242f;color:#aaaab6}
.icon-btn.liked {color:#e5a0fe;background:#36223e}
.icon-btn svg {width:19px;height:19px}
.empty {text-align:center;color:var(--muted);line-height:1.7;padding:36px 24px}
.empty-icon {font-size:34px;margin-bottom:7px}
/* Exercise detail: the most important design of v0.2 */
.detail-heading {margin-top:6px}
.detail-heading .page-title {font-size:29px;margin:9px 0 6px}
.detail-english {direction:ltr;text-align:right;color:#ad9bb7;font-size:13px}
.detail-actions {display:flex;gap:9px;margin:17px 0}
.detail-actions .btn {flex:1}
.poses {display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px;direction:rtl}
.pose {padding:0;width:100%;cursor:zoom-in;color:var(--text);text-align:inherit;background:radial-gradient(ellipse at center 30%,#382342 0%,#18131e 63%,#121217 100%);border:1px solid #58416a;position:relative;overflow:hidden;border-radius:19px;min-width:0}
.pose-photo {width:100%;height:252px;display:block;object-fit:contain;object-position:center 50%}
.pose-label {display:block;position:relative;margin:0 10px 10px;text-align:center;background:#24172ce7;border:1px solid #8750af;color:#f3e9fc;padding:8px 2px;border-radius:10px;font-size:12px;font-weight:900}
.pose-top {position:absolute;z-index:2;top:11px;right:10px;font-size:10px;background:#30213dde;border-radius:8px;padding:5px 8px;color:#d7b5f4}
.motion-bar {display:flex;align-items:center;justify-content:center;gap:9px;color:#b879e4;background:#1b1522;border:1px solid #403147;border-radius:10px;padding:9px;margin-top:10px;font-size:12px;font-weight:800}
.muscle-panel {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;margin-top:12px}
.muscle-panel .muscle-text {flex:1;min-width:0}
.muscle-panel strong {display:block;font-size:15px;margin-bottom:6px}
.muscle-panel img {width:131px;height:89px;object-fit:contain;border-radius:10px}
.muscle-panel .mini-copy {color:#d5abd8}
.cue-panel {padding:18px;margin-top:12px}
.cue-panel h2 {font-size:19px;margin:0 0 12px}
.cue {display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #2b2934;color:#e1deeb;font-size:13px;line-height:1.7}
.cue:last-child {border:0;padding-bottom:0}
.cue-n {flex:0 0 25px;width:25px;height:25px;border-radius:8px;background:#352442;color:#e0b0ff;display:grid;place-items:center;font-weight:900}
.detail-placeholder {border-radius:21px;height:294px;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#423057,#191923 62%);border:1px solid #4c3c59;margin-top:17px;padding:26px}
.detail-placeholder svg {width:70px;height:70px;color:#a988cf}
.detail-placeholder strong {display:block;font-size:16px;margin-top:12px}
.detail-placeholder p {font-size:12px;color:#bab0cb;line-height:1.7;margin-top:9px}
/* Active workout */
.session-banner {padding:16px;background:linear-gradient(115deg,#34203f,#191924);border:1px solid #4c385b;border-radius:18px;margin-top:15px}
.session-banner .small-label {color:#c5a6e0}
.session-summary {display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:8px}
.session-summary strong {font-size:20px}
.progress-track {height:8px;background:#32303d;border-radius:99px;overflow:hidden;margin-top:14px}
.progress-track i {display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#b35cf7,var(--lime));transition:width .25s}
.session-ex {margin:13px 0;padding:16px;border:1px solid #30303e;background:var(--surface);border-radius:18px}
.session-ex-top {display:flex;align-items:flex-start;gap:12px}
.session-ex-num {font-size:13px;width:32px;height:32px;display:grid;place-items:center;border:1px solid #52425d;background:#2c2332;border-radius:10px;color:#dcb2ff;flex:0 0 32px}
.session-ex-name {flex:1;min-width:0}
.session-ex-name strong {font-size:16px;display:block;margin-top:2px}
.session-ex-name small {font-size:11px;color:var(--muted);margin-top:6px;display:block}
.session-subactions {display:flex;gap:9px;margin:12px 0 3px}
.mini-link {display:inline-flex;align-items:center;gap:5px;color:#bb93d4;background:#29232e;padding:7px 9px;border-radius:9px;font-size:11px;font-weight:750}
.set-grid {display:grid;grid-template-columns:27px minmax(0,1fr) minmax(0,1fr) 49px;gap:8px;align-items:center;margin-top:11px}
.set-grid .set-h {color:var(--muted);font-size:11px;text-align:center}
.set-num {text-align:center;font-weight:900;color:#d4d0e0;font-size:13px}
.set-input {width:100%;min-width:0;height:41px;border-radius:10px;border:1px solid #3a3a48;background:#24232e;color:#fff;text-align:center;font-size:14px;font-weight:700;padding:4px}
.set-input:focus {border-color:var(--purple)}
.set-check {height:41px;width:45px;border-radius:10px;background:#2c2d35;color:#9698a4;border:1px solid #42414b;display:grid;place-items:center}
.set-check.done {background:var(--lime);border-color:var(--lime);color:#1a200f}
.rest-bar {position:sticky;top:6px;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#202816;border:1px solid #6a8741;padding:10px 13px;border-radius:13px;box-shadow:0 8px 20px #0009;margin-top:12px}
.rest-time {font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--lime);direction:ltr}
.rest-btn {background:#3b472e;color:white;padding:8px 10px;border-radius:8px;font-size:11px}
.session-floating {position:fixed;z-index:15;bottom:calc(78px + var(--safe-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 30px),470px);box-shadow:0 9px 32px #000b;border:1px solid #5d6c3c;background:#26311e;color:#eaffcd;border-radius:13px;text-align:center;padding:12px;font-size:12px;font-weight:850}
/* Plan builder / settings */
.builder-item {display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;background:#1b1c26;border:1px solid #2d2e38;margin-top:7px;cursor:pointer}
.builder-item input {accent-color:#c8ff48;width:18px;height:18px}
.builder-item strong {font-size:13px}
.builder-item small {display:block;color:var(--muted);font-size:11px;margin-top:5px}
.equip-grid {display:grid;grid-template-columns:1fr 1fr;gap:8px}
.equip-pill {display:flex;align-items:center;gap:8px;padding:12px;background:#1e1f27;border:1px solid #343540;border-radius:12px;color:#d0d0db;font-size:12px;cursor:pointer}
.equip-pill input {accent-color:var(--lime)}
/* Progress */
.graph {display:flex;height:188px;align-items:flex-end;gap:9px;border-bottom:1px solid #41404b;padding:15px 5px 0;direction:ltr;margin:8px 0 34px}
.graph-bar {flex:1;min-width:0;background:linear-gradient(0deg,#8247b8,#d79cff);border-radius:8px 8px 0 0;position:relative;min-height:4px;box-shadow:0 -4px 25px #a150dd1f}
.graph-bar span {position:absolute;bottom:-25px;white-space:nowrap;left:50%;transform:translateX(-50%);color:var(--muted);font-size:10px}
.history-row {display:flex;align-items:center;gap:10px;justify-content:space-between;padding:16px;margin:8px 0}
.history-row strong {font-size:14px}
.history-row small {display:block;color:var(--muted);font-size:12px;margin-top:6px}
.history-volume {color:var(--lime);direction:ltr;font-size:13px;font-weight:900;white-space:nowrap}
/* Navigation */
.bottom-nav {position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:510px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;border-top:1px solid #33303a;background:#101117f0;backdrop-filter:blur(18px);z-index:20;padding:11px 9px calc(12px + var(--safe-bottom))}
.nav-item {background:transparent;border-radius:12px;color:#858696;font-size:11px;font-weight:750;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:3px 0;min-width:0}
.nav-item.active {color:var(--lime)}
.nav-item.active .nav-icon {background:#25301d}
.nav-icon {width:39px;height:33px;border-radius:12px;display:grid;place-items:center}
.nav-icon svg {width:21px;height:21px}
.toast {position:fixed;top:22px;left:50%;transform:translate(-50%,-150%);opacity:0;pointer-events:none;transition:all .25s;z-index:40;padding:12px 18px;border-radius:12px;background:#314221;color:#eaffce;border:1px solid #647b42;box-shadow:0 8px 40px #0009;font-size:13px;font-weight:800;max-width:90%;text-align:center}
.toast.show {transform:translate(-50%,0);opacity:1}
.footer-note {font-size:11px;line-height:1.7;color:#8d8c9b;margin:23px 0 5px}
hr.slim {border:0;border-top:1px solid #32303b;margin:20px 0}
@media (max-width:380px) {
 .app-shell {padding-inline:14px}
 .page-title {font-size:30px}
 .h1-hero {font-size:33px}
 .pose-photo {height:214px}
 .hero {min-height:322px}.hero-inner{min-height:322px}
 .plan-name {font-size:20px}
}
@media(min-width:560px){
 .app-shell {box-shadow:0 0 0 1px #2c2735,0 14px 70px #000b}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.progress-track i,.toast{transition:none}}

/* Accessible full-frame pose viewer */
.image-modal {position:fixed;z-index:80;inset:0;display:grid;place-items:center;padding:17px;background:#06040aef;backdrop-filter:blur(16px)}
.image-modal-inner {position:relative;width:min(100%,440px);max-height:94dvh;display:flex;flex-direction:column;align-items:center;gap:9px;overflow:auto;padding:23px 14px 16px;background:linear-gradient(150deg,#22182a,#111116);border:1px solid #67477a;border-radius:22px}
.image-modal-inner h2 {font-size:22px;margin:2px 0 4px}
.image-modal-inner img {max-width:100%;height:min(65dvh,570px);object-fit:contain;min-height:0;border-radius:14px}
.image-modal-close {position:absolute;left:13px;top:13px;background:#392742;color:#fff;border-radius:50%;width:35px;height:35px;display:grid;place-items:center;font-size:15px}

/* FITNESS NEXT 0.3 · design tokens aligned to the approved JSON */
:root {
  --bg:#0B0D14;
  --surface:#1B1D29;
  --surface2:#252735;
  --surface3:#2A2D3C;
  --line:#383B4C;
  --muted:#B8BBC8;
  --soft:#E4E5EA;
  --text:#FFFFFF;
  --lime:#B8FF16;
  --purple:#A442E8;
  --purple2:#8026C4;
  --purple-soft:#271932;
  --teal:#00D6C9;
  --radius:24px;
}
body {background:var(--bg);font-family:"Heebo",Arial,"Noto Sans Hebrew","Segoe UI",sans-serif}
.app-shell {background:linear-gradient(165deg,#10111A 0%,#0B0D14 42%,#0D0F17 100%);padding-inline:20px}
.app-header {border-bottom-color:#292C39}
.brand-mark,.brand-text b {color:var(--purple)}
.eyebrow.purple {color:#D498FF}
.hero {margin-top:21px;border-color:#4A345F}
.hero-kicker {background:#B8FF161F;color:#DCFFA0;border-color:#B8FF1645}
.hero-kicker .dot {background:var(--lime)}
.card {background:linear-gradient(135deg,#1B1D29,#161823);border-color:var(--line)}
.metric {background:#1B1D29;border-color:#303342}
.btn {border-radius:14px}
.btn-purple {background:linear-gradient(115deg,#A442E8,#7D2CC0);border-color:#B96AF0}
.btn-muted {background:#252735;border-color:#393C4E}
.btn-outline {border-color:#424656}
.data-chip {background:#272937;border-color:#3B3D50}
.text-action,.inline-link {color:var(--lime)}
.chip.active,.seg.active,.set-check.done {background:var(--lime);border-color:var(--lime)}
.ex-row {background:var(--surface);border-color:var(--line)}
.icon-btn {background:#292C39}
.icon-btn:focus-visible {outline:2px solid var(--lime);outline-offset:2px}
/* The pose sequence always reads left to right, even though the app itself is RTL. */
.poses {direction:ltr}
.pose {direction:rtl;border-color:#5B3C6F}
.pose-top {right:auto;left:11px}
.pose-label {direction:rtl}
.pose-photo {height:252px}
.motion-bar {color:#D9B2F5}

/* The three personal hubs are available right on the Home screen. */
.hero-actions {display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.hero-secondary {display:inline-flex;gap:6px;align-items:center;background:#21182ACC;border:1px solid #79608D;color:#F2E7FA;min-height:47px;border-radius:13px;padding:10px 13px;font-size:12px;font-weight:800;backdrop-filter:blur(5px)}
.quick-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
.quick-card {background:linear-gradient(155deg,#23232E,#181A25);border:1px solid #3D4050;border-radius:16px;min-height:138px;text-align:right;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:12px 12px 11px;color:white;position:relative;overflow:hidden}
.quick-card:hover {background:linear-gradient(155deg,#2B2839,#20222F)}
.quick-card strong {font-size:13px;line-height:1.35;white-space:normal}
.quick-card small {font-size:10px;color:var(--muted);line-height:1.4}
.quick-icon {width:37px;height:37px;display:grid;place-items:center;border-radius:11px;margin-bottom:auto}
.quick-icon.lime {background:#B8FF1620;color:var(--lime)}
.quick-icon.purple-bg {background:#A442E825;color:#D292FF}
.quick-icon.pink {background:#DE79E51C;color:#F1A3EF}
.quick-arrow {position:absolute;left:10px;bottom:12px;color:#A0A4B3}

/* My workout: one selected program with the actual ordered list visible. */
.my-plan {margin-top:22px;background:linear-gradient(155deg,#242035 0%,#191B28 40%,#151924 100%);border:1px solid #60447F;border-radius:24px;overflow:hidden;box-shadow:0 14px 40px #0003}
.my-plan-head {padding:22px 17px 16px;display:flex;justify-content:space-between;gap:12px;align-items:start;border-bottom:1px solid #373242}
.my-plan-head h2 {direction:ltr;text-align:right;margin:9px 0 7px;font-size:29px;line-height:1;font-weight:900;letter-spacing:-.7px}
.my-plan-head p {margin:0;color:#BFB7C9;font-size:12px;line-height:1.5}
.plan-count {border:1px solid #605078;border-radius:10px;background:#342845;color:#E2C1FA;padding:9px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.my-plan-list {padding:4px 12px 0}
.plan-ex {display:flex;align-items:center;text-align:right;gap:10px;width:100%;padding:10px 3px;color:white;background:transparent;border-bottom:1px solid #393444}
.plan-ex:last-child {border-bottom:0}
.plan-ex:hover {background:#2D283755}
.plan-ex-index {width:25px;direction:ltr;color:#C6A4E6;font-weight:800;font-size:13px;text-align:center;flex:0 0 25px}
.plan-ex-thumb {width:45px;height:45px;flex:0 0 45px;background:radial-gradient(circle at center,#393349,#232531);border-radius:12px;overflow:hidden;display:grid;place-items:center;color:#A67BD3}
.plan-ex-thumb img {width:100%;height:100%;object-fit:cover;object-position:center 45%}
.plan-ex-thumb svg {width:23px;height:23px}
.plan-ex-text {flex:1;min-width:0}
.plan-ex-text strong {display:block;font-size:13px;margin-bottom:4px}
.plan-ex-text small {display:block;color:#AEB0C0;font-size:10px;line-height:1.4}
.plan-ex>svg {flex:0 0 17px;color:#A49CB5}
.my-plan-actions {padding:16px;display:grid;gap:9px;background:#15182466}
.inline-warning {color:#A7A8B7;font-size:11px;line-height:1.7;margin:11px 3px 20px}
.plans-compact {display:grid;gap:9px}
.plan-small {display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.plan-small strong {display:block;text-align:right;font-weight:900;font-size:17px}
.plan-small small {display:block;color:var(--muted);font-size:11px;line-height:1.5;margin-top:5px}

/* My Exercises and Favorites are independent, persistent collections. */
.collection-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.collection-card {background:#1F202C;color:#AEB1C0;border:1px solid #3C3E50;border-radius:15px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:14px 11px 11px;min-height:116px;text-align:right}
.collection-card svg {color:#B275D6}
.collection-card strong {font-size:24px;line-height:1;color:#FFFFFF;direction:ltr}
.collection-card small {font-size:11px;line-height:1.35;color:#B8B6C4;font-weight:750}
.collection-card.is-selected {border-color:#B8FF16;background:linear-gradient(145deg,#26321D,#1B2022)}
.collection-card.is-selected svg,.collection-card.is-selected strong {color:var(--lime)}
.collection-note {font-size:11px;line-height:1.75;color:#BCB5C8;padding:11px 12px;margin-top:13px;background:#252133;border:1px solid #493951;border-radius:12px}
.ex-open {display:flex;align-items:center;flex:1;min-width:0;gap:10px;padding:0;text-align:right;background:transparent;color:inherit}
.ex-tools {flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
.ex-tools .icon-btn {width:34px;height:33px;flex-basis:33px;border-radius:9px}
.icon-btn.mine-active {color:var(--lime);background:#2D3928}
.ex-row .ex-thumb {flex:0 0 68px;width:68px;height:72px}
.ex-row .ex-info strong {font-size:13px}
.ex-row .ex-info small {font-size:10px}
.detail-save-actions .btn {font-size:12px;padding:10px 7px}

/* Focused active workout: one exercise at a time, with a compact queue. */
.focus-exercise {margin-top:15px;background:linear-gradient(145deg,#222436,#181A26);border:1px solid #50405D;border-radius:20px;overflow:hidden}
.focus-ex-header {display:flex;gap:14px;align-items:center;justify-content:space-between;padding:20px 16px 12px}
.focus-ex-header h2 {margin:8px 0 7px;font-size:22px;line-height:1.15;letter-spacing:-.5px}
.focus-ex-graphic {width:95px;height:100px;flex:0 0 95px;border-radius:14px;background:#31243F;overflow:hidden;display:grid;place-items:center;color:#A78BCD}
.focus-ex-graphic img {width:100%;height:100%;object-fit:cover}
.focus-ex-graphic svg {width:45px;height:45px}
.focus-exercise .session-subactions {padding:0 16px;margin:0 0 12px}
.focus-exercise .set-grid {margin:0 16px 14px;gap:6px;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 46px}
.focus-next {display:flex;justify-content:space-between;gap:8px;padding:14px 16px 16px;background:#161925;border-top:1px solid #3A3446}
.focus-next .btn {font-size:11px;padding:9px;white-space:normal}
.session-queue {display:grid;gap:8px}
.session-queue-head .section-head {margin-bottom:10px}
.session-queue-item {width:100%;display:flex;align-items:center;gap:12px;text-align:right;padding:11px 13px;border-radius:13px;border:1px solid var(--line);color:#EBEBF2;background:var(--surface)}
.session-queue-item.selected {border-color:#B8FF16AA;background:#242E24}
.session-queue-n {width:29px;height:29px;border-radius:9px;background:#303143;display:grid;place-items:center;color:#E1C5F4;font-weight:850;font-size:12px;flex:0 0 29px}
.session-queue-label {flex:1;min-width:0}
.session-queue-label strong {display:block;font-size:12px}
.session-queue-label small {display:block;color:var(--muted);font-size:10px;margin-top:3px}
.session-queue-status {color:var(--lime);font-size:15px;flex:0 0 20px;text-align:center}
.session-footer {margin-top:23px}
.settings-label {display:block;margin-top:19px}

@media(max-width:375px) {
 .app-shell {padding-inline:14px}
 .quick-card {padding:11px 9px;min-height:135px}
 .quick-card strong {font-size:12px}
 .quick-card small {font-size:9px}
 .hero-secondary {font-size:11px}
 .pose-photo {height:210px}
 .focus-ex-graphic {width:78px;flex-basis:78px;height:95px}
 .collection-card {padding:11px 8px}
 .collection-card small {font-size:10px}
}

/* v0.4: exercise techniques and visual grouping */
.technique-badge { display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:10px;font-weight:800;line-height:1.4;padding:4px 8px;margin-top:6px;border-radius:7px;background:#3D2449;border:1px solid #78459E;color:#EAB8FF;white-space:normal;}
.plan-ex-text .technique-badge {margin-top:7px;}
.source-programs {display:block;color:#BAF27F!important;font-weight:850;direction:ltr;text-align:right;letter-spacing:.6px;}
.poses {direction:ltr;} /* Stage 1 LEFT, Stage 2 RIGHT across all exercises, even in RTL */
.pose {direction:rtl;}
.focus-ex-header .technique-badge {font-size:11px;}

.set-actions {display:flex;align-items:center;gap:9px;margin-top:14px;flex-wrap:wrap;}
.set-actions .mini-link {border:1px solid #413448;}
.set-input::placeholder {color:#79758a;}

 return `<div class="eyebrow">YOUR PROGRAM · YOUR RULES</div><h1 class="page-title">האימון שלי</h1><p class="page-intro">כל התרגילים של התוכנית שלך, במקום אחד. אפשר להתחיל מיד או להתאים אותה.</p>
 ${state.session?`<div class="notice"><strong>האימון שלך עדיין פעיל.</strong> התקדמות הסטים נשמרה. <div class="mt-8">${primary('המשך אימון', 'openSession()','btn-small')}</div></div>`:''}
 <section class="my-plan"><div class="my-plan-head"><div><span class="small-label" style="color:var(--lime)">CURRENT PLAN</span><h2>${safe(p.name)}</h2><p>${safe(p.sub||'התוכנית האישית שלך')}</p></div><span class="plan-count">${p.ids.length} תרגילים</span></div>
 <div class="my-plan-list">${p.ids.map((id,i)=>{const item=ex(id);return item?`<button class="plan-ex" onclick="openExercise('${id}')"><span class="plan-ex-index">${String(i+1).padStart(2,'0')}</span><span class="plan-ex-thumb">${exerciseThumbnail(item)}</span><span class="plan-ex-text"><strong>${safe(item.name)}</strong><small>${safe(item.gear)} ${techniqueBadge(planTag(p,id))}</small></span>${ico('chevron',17)}</button>`:'';}).join('')}</div>
 <div class="my-plan-actions">${primary(`${ico('play',18)} ${state.session?'המשך אימון':'התחל את האימון'}`,state.session?'openSession()':'startWorkout()','btn-block')}
 <button class="btn btn-outline btn-block" onclick="customizePlan()">${ico('edit',17)} ${p.id.startsWith('custom')?'עריכת התוכנית שלי':'יצירת גרסה אישית לעריכה'}</button></div></section>
 <p class="inline-warning">התוכניות FB, A ו־B מבוססות על הרשימות ששלחת. המשקלים, החזרות וזמני הביצוע לא יובאו. סימוני סופר־סט ודרופ־סט נשמרו.</p>
 ${headSection('תוכניות נוספות')}
 <div class="plans-compact">${planList().filter(x=>x.id!==p.id).map(plan=>`<article class="plan-small"><div><strong dir="ltr">${safe(plan.name)}</strong><small>${safe(plan.sub||'תוכנית אישית')} · ${plan.ids.length} תרגילים</small></div><button class="btn btn-outline btn-small" onclick="choosePlan('${plan.id}')">בחר</button></article>`).join('')}</div>
 ${primary(`${ico('plus',17)} בניית תוכנית אישית מאפס`,'newPlan()','btn-muted btn-block mt-18')}
 ${headSection('הציוד בחדר הכושר')}
 <div class="card card-pad"><p class="mini-copy" style="margin-bottom:13px">סמן את הציוד הזמין. הוא ישמש לסינון הספרייה וההחלפות; תרגילים שכבר שמרת לא יימחקו.</p><div class="equip-grid">${allGears.map(g=>`<label class="equip-pill"><input type="checkbox" ${state.equipment.includes(g)?'checked':''} onchange="setGear('${g}',this.checked)">${g}</label>`).join('')}</div></div>`;
}
function customizePlan(){const p=activePlan();if(p.id.startsWith('custom')){editPlan(p.id);return;}builderDraft={id:null,name:p.name+' — שלי',ids:[...p.ids],tags:{...(p.tags||{})}};screen={kind:'builder'};render();window.scrollTo({top:0,behavior:'instant'});}

function choosePlan(id){if(!planList().some(p=>p.id===id))return;state.selectedPlan=id;persist();notify('התוכנית עודכנה');render(true);}
function setGear(g,on){state.equipment=on?[...new Set([...state.equipment,g])]:state.equipment.filter(x=>x!==g);persist();render(true);}

function favoriteButton(id){return `<button class="icon-btn ${state.favorites.includes(id)?'liked':''}" title="${state.favorites.includes(id)?'הסר ממועדפים':'הוסף למועדפים'}" aria-label="${state.favorites.includes(id)?'הסר ממועדפים':'הוסף למועדפים'}" onclick="toggleFavorite('${id}')">${ico('heart',19)}</button>`;}
function mineButton(id){return `<button class="icon-btn ${state.myExercises.includes(id)?'mine-active':''}" title="${state.myExercises.includes(id)?'הסר מהתרגילים שלי':'הוסף לתרגילים שלי'}" aria-label="${state.myExercises.includes(id)?'הסר מהתרגילים שלי':'הוסף לתרגילים שלי'}" onclick="toggleMine('${id}')">${ico('bookmark',19)}</button>`;}
function toggleFavorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(f=>f!==id):[...state.favorites,id];persist();render(true);notify(state.favorites.includes(id)?'נוסף למועדפים':'הוסר מהמועדפים');}
function toggleMine(id){state.myExercises=state.myExercises.includes(id)?state.myExercises.filter(x=>x!==id):[...state.myExercises,id];persist();render(true);notify(state.myExercises.includes(id)?'נוסף לתרגילים שלי':'הוסר מהתרגילים שלי');}

function libraryFiltered(){
 // Saved collections remain accessible even when equipment is temporarily unavailable.
 let candidates=(category==='שלי'||category==='מועדפים') && screen.kind!=='replace'
   ? exercises
   : exercises.filter(item=>state.equipment.includes(item.gear));
 if(category==='מועדפים') candidates=candidates.filter(item=>state.favorites.includes(item.id));
 else if(category==='שלי') candidates=candidates.filter(item=>state.myExercises.includes(item.id));
 else if(category!=='הכל') candidates=candidates.filter(item=>item.muscle===category);
 if(listQuery.trim())candidates=candidates.filter(item=>(item.name+' '+item.en+' '+item.muscle).toLowerCase().includes(listQuery.trim().toLowerCase()));
 return candidates;
}
function usedInPlans(id){return templates.filter(p=>p.ids.includes(id)).map(p=>p.id.toUpperCase()).join(' · ');}
function libraryRows(replacing=false){
 const items=libraryFiltered();
 if(!items.length)return `<div class="empty"><div class="empty-icon">${ico('search',33)}</div>${category==='שלי'?'עדיין לא שמרת תרגילים באזור הזה. אפשר לבחור ״הכל״ ולהוסיף תרגילים לספרייה האישית.':category==='מועדפים'?'עדיין אין מועדפים. סמן לב בתרגיל שאהבת.':'אין תרגילים שתואמים לחיפוש. נסה מסנן או ציוד אחר.'}</div>`;
 return items.map(item=>`<div class="ex-row" role="group" aria-label="${safe(item.name)}"><button class="ex-open" onclick="${replacing?`replaceExercise('${item.id}')`:`openExercise('${item.id}')`}" aria-label="${replacing?'בחר':'פתח'} ${safe(item.name)}"><span class="ex-thumb">${exerciseThumbnail(item)}</span><span class="ex-info"><strong>${safe(item.name)}</strong><small>${item.muscle} · ${item.gear}</small>${usedInPlans(item.id)?`<small class="source-programs">${usedInPlans(item.id)}</small>`:''}${item.visual?'<span class="mock-label">שתי תנוחות מצולמות</span>':'<span class="mock-label">צילום בהכנה · הדרכה כתובה</span>'}</span></button>${replacing?`<button class="btn btn-small btn-purple" onclick="replaceExercise('${item.id}')">בחר</button>`:`<span class="ex-tools">${mineButton(item.id)}${favoriteButton(item.id)}</span>`}</div>`).join('');
}
function libraryView(replacing=false){
 const options=['שלי','מועדפים','הכל','חזה','גב','רגליים','כתפיים','יד קדמית','יד אחורית','בטן'];
 return `${replacing?'<button class="back-link" onclick="back()">'+ico('chevron',16)+' חזרה לאימון</button>':'<div class="eyebrow">YOUR MOVEMENT LIBRARY</div>'}
 <h1 class="page-title">${replacing?'בחירת תרגיל חלופי':'התרגילים שלי'}</h1><p class="page-intro">${replacing?'בחר תרגיל מתאים מתוך הציוד הזמין.':'תרגילים ששמרת, מועדפים וספרייה מלאה — הכל במקום אחד.'}</p>
 ${!replacing?`<div class="collection-grid"><button class="collection-card ${category==='שלי'?'is-selected':''}" onclick="setCategory('שלי')">${ico('bookmark',23)}<strong>${state.myExercises.length}</strong><small>התרגילים שלי</small></button><button class="collection-card ${category==='מועדפים'?'is-selected':''}" onclick="setCategory('מועדפים')">${ico('heart',23)}<strong>${state.favorites.length}</strong><small>מועדפים</small></button><button class="collection-card ${category==='הכל'?'is-selected':''}" onclick="setCategory('הכל')">${ico('grid',23)}<strong>${exercises.length}</strong><small>כל התרגילים</small></button></div>`:''}
 <div class="search-wrap">${ico('search',20)}<input class="field" id="exercise-search" value="${safe(listQuery)}" aria-label="חיפוש תרגילים" placeholder="חפש תרגיל או קבוצת שרירים" oninput="searchLibrary(this.value)"></div>
 <div class="chips">${options.map(c=>`<button class="chip ${category===c?'active':''}" onclick="setCategory('${c}')">${c==='שלי'?'התרגילים שלי':c}</button>`).join('')}</div>
 <div class="flex between"><div class="mini-copy">${libraryFiltered().length} תרגילים ברשימה</div>${primary('ניהול ציוד',"goMyWorkout()",'btn-small btn-muted')}</div>
 ${category==='שלי'&&!replacing?'<div class="collection-note">התרגילים המועדפים שסיפקת עבור FB, A ו־B נשמרו כאן מראש. תרגיל שחוזר בכמה תוכניות מופיע פעם אחת. אפשר להוסיף ולהסיר תרגילים באופן חופשי.</div>':''}
 <div class="exercise-list" id="exercise-results">${libraryRows(replacing)}</div>`;
}
function searchLibrary(query){listQuery=query;$('#exercise-results').innerHTML=libraryRows(screen.kind==='replace');}
function setCategory(c){category=c;render(true);}
function openExercise(id,from){if(!ex(id))return;const returning=from || (screen.kind==='session'?'session':'main');screen={kind:'detail',id,from:returning};render();window.scrollTo({top:0,behavior:'instant'});}

function closePose(){const node=$('#pose-overlay');if(node)node.remove();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePose();});

function newSessionItem(id,index){const item=ex(id);const last=state.history.find(h=>(h.sets||[]).some(s=>s.exerciseId===id));const prev=last?.sets?.find(s=>s.exerciseId===id);
 return {key:`e${Date.now()}_${index}_${Math.floor(Math.random()*10000)}`,exerciseId:id,sets:Array.from({length:3},()=>({weight:Math.max(0,+prev?.weight||0),reps:Math.max(0,+prev?.reps||0),done:false}))};}
function startWorkout(id){
 if(state.session){if(id&&state.session.planId!==id)notify('כבר יש אימון פעיל. סיים או בטל אותו קודם.');openSession();return;}
 const p=planList().find(x=>x.id===id)||activePlan();state.selectedPlan=p.id;
 state.session={planId:p.id,planName:p.name,startedAt:Date.now(),items:p.ids.filter(allowedId=>allowedIds.has(allowedId)).map(newSessionItem),restUntil:0,restSeconds:75,focusIndex:0};
 persist();openSession();
}
function openSession(){if(!state.session){notify('אין אימון פעיל');return;}screen={kind:'session'};render();window.scrollTo({top:0,behavior:'instant'});}
function sessionTotals(){let items=state.session?.items||[];return {total:items.reduce((a,i)=>a+i.sets.length,0),done:items.reduce((a,i)=>a+i.sets.filter(s=>s.done).length,0)};}
function sessionView(){
 if(!state.session)return '<div class="empty">אין אימון פעיל</div>';
 const ses=state.session,counts=sessionTotals(),progress=counts.total?Math.round(counts.done/counts.total*100):0;
 const i=Math.max(0,Math.min(ses.focusIndex||0,ses.items.length-1));
 const entry=ses.items[i],item=entry&&ex(entry.exerciseId);
 if(!item)return '<div class="empty">לא נמצאו תרגילים באימון הפעיל.</div>';
 return `<div class="eyebrow purple">WORKOUT IN PROGRESS</div><h1 class="page-title">אימון פעיל</h1><p class="page-intro">${safe(ses.planName)} · התקדמות נשמרת אוטומטית בדפדפן.</p>
 <div class="session-banner"><div class="flex between"><span class="small-label">YOUR SESSION</span><span class="data-chip green">${counts.done} / ${counts.total} סטים</span></div><div class="session-summary"><strong>${progress}% הושלמו</strong><span class="mini-copy">${ses.items.length} תרגילים באימון</span></div><div class="progress-track"><i style="width:${progress}%"></i></div></div>
 <div id="rest-area">${restHtml()}</div>
 <section class="focus-exercise"><div class="focus-ex-header"><div><span class="small-label">EXERCISE ${String(i+1).padStart(2,'0')} / ${String(ses.items.length).padStart(2,'0')}</span><h2>${safe(item.name)}</h2><span class="mini-copy">${safe(item.muscle)} · ${safe(item.gear)} · ${entry.sets.length} שורות רישום</span>${techniqueBadge(planTag(planList().find(p=>p.id===ses.planId),item.id))}</div><div class="focus-ex-graphic">${exerciseThumbnail(item)}</div></div>
 <div class="session-subactions"><button class="mini-link" onclick="openExercise('${item.id}','session')">${ico('image',16)} הדגמת התרגיל</button><button class="mini-link" onclick="openReplacement(${i})">${ico('refresh',16)} החלף תרגיל</button></div>
 <div class="mini-copy mt-12">המשקלים והחזרות לא הועתקו מהרשימה. מלא אותם לפי מה שביצעת בפועל. מוצגות שלוש שורות ריקות כברירת מחדל.</div><div class="set-grid"><span class="set-h">סט</span><span class="set-h">ק״ג</span><span class="set-h">${item.unit||'חזרות'}</span><span class="set-h">בוצע</span>${entry.sets.map((s,j)=>`<span class="set-num">${j+1}</span><input type="number" min="0" max="9999" step="0.5" class="set-input" inputmode="decimal" aria-label="משקל סט ${j+1}" value="${s.weight||''}" placeholder="—" onchange="changeSet('${entry.key}',${j},'weight',this.value)"><input type="number" min="0" max="9999" step="1" class="set-input" inputmode="numeric" aria-label="${item.unit||'חזרות'} סט ${j+1}" value="${s.reps||''}" placeholder="—" onchange="changeSet('${entry.key}',${j},'reps',this.value)"><button class="set-check ${s.done?'done':''}" onclick="toggleSet('${entry.key}',${j})" aria-label="${s.done?'בטל סימון':'סמן כבוצע'} סט ${j+1}">${ico(s.done?'check':'plus',20)}</button>`).join('')}</div><div class="set-actions"><button class="mini-link" onclick="addSet('${entry.key}')">${ico('plus',16)} הוסף סט</button><button class="mini-link" onclick="removeLastSet('${entry.key}')" ${entry.sets.length<=1?'disabled':''}>הסר סט אחרון</button></div>
 <div class="focus-next"><button class="btn btn-muted btn-small" onclick="openSessionIndex(${i-1})" ${i===0?'disabled':''}>${ico('right',17)} לתרגיל הקודם</button><button class="btn btn-purple btn-small" onclick="openSessionIndex(${i+1})" ${i===ses.items.length-1?'disabled':''}>לתרגיל הבא ${ico('arrow',17)}</button></div></section>
 <div class="session-queue-head">${headSection('התרגילים באימון')}</div><div class="session-queue">${ses.items.map((e,j)=>{const exItem=ex(e.exerciseId),n=e.sets.filter(x=>x.done).length;return `<button class="session-queue-item ${j===i?'selected':''}" onclick="openSessionIndex(${j})"><span class="session-queue-n">${j+1}</span><span class="session-queue-label"><strong>${safe(exItem.name)}</strong><small>${n}/${e.sets.length} סטים</small></span><span class="session-queue-status">${n===e.sets.length?ico('check',17):j===i?'●':ico('chevron',16)}</span></button>`;}).join('')}</div>
 <div class="card card-pad mt-18"><div class="flex between"><div><strong>טיימר מנוחה</strong><div class="mini-copy mt-8">בחר זמן מנוחה בין הסטים</div></div><span class="data-chip">${ses.restSeconds} שנ׳</span></div><div class="chips">${[60,75,90,120].map(n=>`<button class="chip ${ses.restSeconds===n?'active':''}" onclick="setRestSeconds(${n})">${n} שנ׳</button>`).join('')}</div></div>
 <div class="session-footer">${primary(`${ico('check',18)} סיום ושמירת האימון`,'finishWorkout()','btn-block')}${primary('ביטול אימון','cancelWorkout()','btn-outline btn-block mt-12')}</div>`;
}
function openSessionIndex(index){if(!state.session||index<0||index>=state.session.items.length)return;state.session.focusIndex=index;persist();render();window.scrollTo({top:70,behavior:'instant'});}

function setRestSeconds(seconds){if(!state.session)return;state.session.restSeconds=seconds;persist();render(true);}
function restHtml(){if(!state.session?.restUntil||state.session.restUntil<=Date.now())return '';
 return `<div class="rest-bar"><span>זמן מנוחה ${ico('clock',16)}</span><strong class="rest-time" id="rest-time">00:00</strong><button class="rest-btn" onclick="stopRest()">דלג</button></div>`;}
function updateRest(){const el=$('#rest-time');if(!el||!state.session)return;const left=Math.ceil((state.session.restUntil-Date.now())/1000);if(left<=0){state.session.restUntil=0;persist();$('#rest-area').innerHTML='';return;}el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');}
function stopRest(){if(!state.session)return;state.session.restUntil=0;persist();const r=$('#rest-area');if(r)r.innerHTML='';}
function changeSet(key,index,field,value){if(!state.session)return;const entry=state.session.items.find(x=>x.key===key);if(!entry||!entry.sets[index])return;const val=Number(value);entry.sets[index][field]=Number.isFinite(val)?Math.min(9999,Math.max(0,val)):0;persist();}
function toggleSet(key,index){if(!state.session)return;let item=state.session.items.find(x=>x.key===key);if(!item||!item.sets[index])return;if(!item.sets[index].done && !(item.sets[index].reps>0)){notify('יש להזין חזרות או זמן לפני סימון סט');return;}item.sets[index].done=!item.sets[index].done;if(item.sets[index].done)state.session.restUntil=Date.now()+state.session.restSeconds*1000;persist();render(true);updateRest();}
function addSet(key){const entry=state.session?.items.find(i=>i.key===key);if(!entry)return;
 const last=entry.sets.at(-1);entry.sets.push({weight:last?.weight||0,reps:last?.reps||0,done:false});persist();render(true);}
function removeLastSet(key){const entry=state.session?.items.find(i=>i.key===key);if(!entry||entry.sets.length<=1)return;
 if(entry.sets.at(-1).done){notify('יש לבטל תחילה את סימון הסט שהושלם');return;}
 entry.sets.pop();persist();render(true);}
function openReplacement(index){if(!state.session)return;screen={kind:'replace',index};category='הכל';listQuery='';render();window.scrollTo({top:0,behavior:'instant'});}
function replaceExercise(id){if(screen.kind!=='replace'||!state.session)return;const index=screen.index;if(state.session.items.some((entry,i)=>i!==index&&entry.exerciseId===id)){notify('התרגיל כבר נמצא באימון');return;}
 state.session.items[index]=newSessionItem(id,index);state.session.focusIndex=index;persist();screen={kind:'session'};render();window.scrollTo({top:0,behavior:'instant'});notify('התרגיל הוחלף');}
function addExerciseToSession(id){if(!state.session)return;if(state.session.items.some(i=>i.exerciseId===id)){notify('התרגיל כבר באימון');return;}state.session.items.push(newSessionItem(id,state.session.items.length));state.session.focusIndex=state.session.items.length-1;persist();openSession();notify('התרגיל נוסף לאימון');}
function finishWorkout(){if(!state.session)return;const ses=state.session;const sets=ses.items.flatMap(item=>item.sets.filter(s=>s.done).map(s=>({exerciseId:item.exerciseId,weight:s.weight,reps:s.reps})));if(!sets.length){notify('צריך לסמן לפחות סט אחד לפני השמירה');return;}
 state.history.unshift({id:Date.now(),date:Date.now(),plan:ses.planName,duration:Math.max(1,Math.round((Date.now()-ses.startedAt)/60000)),sets});state.session=null;persist();screen={kind:'main'};tab='progress';render();window.scrollTo({top:0,behavior:'instant'});notify('האימון נשמר! כל הכבוד.');}
function cancelWorkout(){if(!state.session)return;if(!confirm('לבטל את האימון? כל הסטים שלא נשמרו יימחקו.'))return;state.session=null;persist();screen={kind:'main'};tab='workouts';render();window.scrollTo({top:0,behavior:'instant'});notify('האימון בוטל');}

function newPlan(){builderDraft={id:null,name:'',ids:[],tags:{}};screen={kind:'builder'};render();window.scrollTo({top:0,behavior:'instant'});}
function editPlan(id){let p=state.plans.find(x=>x.id===id);if(!p)return;builderDraft={id:p.id,name:p.name,ids:[...p.ids],tags:{...(p.tags||{})}};screen={kind:'builder'};render();window.scrollTo({top:0,behavior:'instant'});}
function builderView(){if(!builderDraft)builderDraft={id:null,name:'',ids:[],tags:{}};return `<button class="back-link" onclick="back()">${ico('chevron',16)} חזרה לתוכניות</button><div class="eyebrow">CREATE YOUR PROGRAM</div><h1 class="page-title">${builderDraft.id?'עריכת תוכנית':'תוכנית אישית'}</h1><p class="page-intro">בחר את התרגילים שאתה אוהב, לפי הציוד שלך.</p>
 <div class="mt-24"><label for="builder-name" class="mini-copy">שם התוכנית</label><input id="builder-name" maxlength="50" class="field mt-8" placeholder="למשל: אימון יום ראשון" value="${safe(builderDraft.name)}" oninput="builderDraft.name=this.value"></div>
 ${headSection('בחר תרגילים')}<div class="notice">${builderDraft.ids.length} תרגילים נבחרו. אפשר לשנות את הרשימה גם לאחר השמירה.</div>
 ${exercises.map(x=>`<label class="builder-item"><input type="checkbox" ${builderDraft.ids.includes(x.id)?'checked':''} onchange="draftToggle('${x.id}',this.checked)"><span><strong>${safe(x.name)}</strong><small>${x.muscle} · ${x.gear}</small></span></label>`).join('')}
 ${primary('שמירת התוכנית','saveBuilder()','btn-block mt-24')}${builderDraft.id?primary(`${ico('trash',16)} מחיקת תוכנית`,'deletePlan()','btn-outline btn-block mt-12'):''}`;}
function draftToggle(id,enabled){if(!builderDraft)return;builderDraft.ids=enabled?[...new Set([...builderDraft.ids,id])]:builderDraft.ids.filter(x=>x!==id);}
function saveBuilder(){if(!builderDraft)return;const name=builderDraft.name.trim(),ids=builderDraft.ids;if(!name||!ids.length){notify('יש להזין שם ולבחור לפחות תרגיל אחד');return;}
 if(builderDraft.id){let p=state.plans.find(x=>x.id===builderDraft.id);if(p){p.name=name;p.ids=ids;p.tags=Object.fromEntries(Object.entries(builderDraft.tags||{}).filter(([id])=>ids.includes(id)));p.sub='תוכנית אישית';}}
 else{const id='custom'+Date.now();state.plans.push({id,name,sub:'תוכנית אישית',ids,tags:Object.fromEntries(Object.entries(builderDraft.tags||{}).filter(([id])=>ids.includes(id)))});state.selectedPlan=id;}
 persist();builderDraft=null;screen={kind:'main'};tab='workouts';render();window.scrollTo({top:0,behavior:'instant'});notify('התוכנית נשמרה');}
function deletePlan(){if(!builderDraft?.id)return;if(!confirm('למחוק את התוכנית האישית הזו?'))return;state.plans=state.plans.filter(p=>p.id!==builderDraft.id);if(state.selectedPlan===builderDraft.id)state.selectedPlan='fb';builderDraft=null;persist();tab='workouts';screen={kind:'main'};render();notify('התוכנית נמחקה');}

function progressView(){const h=state.history,vol=h.reduce((a,w)=>a+volume(w),0),last7=h.slice(0,7).reverse(),max=Math.max(1,...last7.map(volume));return `<div class="eyebrow">EVERY REP COUNTS</div><h1 class="page-title">ההתקדמות שלי</h1><p class="page-intro">הכל מתחיל בעוד אימון אחד.</p>
 <div class="metrics">${metric('אימונים',fmt(h.length))}${metric('סטים',fmt(h.reduce((a,w)=>a+checkedCount(w),0)))}${metric('נפח בק״ג',fmt(Math.round(vol)))}</div>
 ${headSection('נפח אימון','')}
 <div class="card card-pad">${h.length?`<p class="mini-copy">נפח מחושב כמשקל × חזרות, על סמך הסטים שסומנו.</p><div class="graph">${last7.map(w=>`<div class="graph-bar" style="height:${Math.max(3,volume(w)/max*100)}%" title="${fmt(volume(w))} ק״ג"><span>${shortDate(w.date)}</span></div>`).join('')}</div>`:`<div class="empty">${ico('trend',40)}<div class="mt-12">הגרף יופיע אחרי שתשמור את האימון הראשון.</div></div>`}</div>
 ${headSection('היסטוריית האימונים')}
 ${h.length?h.map(w=>`<article class="card history-row"><div><strong>${safe(w.plan)}</strong><small>${shortDate(w.date)} · ${checkedCount(w)} סטים · ${w.duration||1} דק׳</small></div><div class="history-volume">${fmt(Math.round(volume(w)))} ק״ג</div></article>`).join(''):'<div class="empty">עדיין לא שמרת אימונים.<br>אפשר להתחיל מתוכנית האימון שלך.</div>'}
 ${primary(`${ico('download',16)} ייצוא נתוני האימון`,'downloadBackup()','btn-muted btn-block mt-24')}`;}
function settingsView(){return `<button class="back-link" onclick="back()">${ico('chevron',16)} חזרה לאפליקציה</button><div class="eyebrow">YOUR FITNESS · YOUR DATA</div><h1 class="page-title">פרופיל והגדרות</h1><p class="page-intro">העדפות אימון ושמירת הנתונים שלך בדפדפן.</p>
 <div class="card card-pad mt-24"><strong>מטרת אימון</strong><select class="field mt-12" aria-label="מטרת אימון" onchange="setProfile('goal',this.value)">${['חיזוק וכושר כללי','בניית שריר','שיפור סיבולת','חזרה הדרגתית לאימונים'].map(x=>`<option value="${x}" ${state.profile.goal===x?'selected':''}>${x}</option>`).join('')}</select><strong class="settings-label">רמת ניסיון</strong><select class="field mt-12" aria-label="רמת ניסיון" onchange="setProfile('level',this.value)">${['מתחיל','בינוני','מתקדם'].map(x=>`<option value="${x}" ${state.profile.level===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="card card-pad mt-12"><strong>גיבוי ושחזור</strong><p class="mini-copy mt-12">ייצא את התוכנית, ״התרגילים שלי״, המועדפים והיסטוריית האימונים. ניתן לייבא גיבוי מ־0.2, 0.3 ו־0.4.</p><div class="flex wrap mt-18">${primary(`${ico('download',16)} ייצוא JSON`,'downloadBackup()','btn-muted')}${primary(`${ico('upload',16)} ייבוא JSON`,'chooseImport()','btn-outline')}</div></div>
 <div class="card card-pad mt-12"><strong>Fitness Next 0.4</strong><p class="mini-copy mt-12">האפליקציה המקורית וגרסת 0.2 נשארות ללא שינוי. זו גרסת פיתוח מקומית; אין סנכרון בין מכשירים. הדגמה מצולמת בשתי תנוחות קיימת כרגע לסקוואט עם משקולות בלבד. התמונות הן להמחשה ולא הדגמה של סקוואט עם מוט.</p></div>`;}
function setProfile(key,value){if(!['goal','level'].includes(key))return;state.profile[key]=value;persist();notify('ההעדפות נשמרו');}

function downloadBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),version:'0.4'},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fitness-next-backup-v0.4.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('קובץ הגיבוי מוכן');}
function chooseImport(){const input=$('#import-file');input.value='';input.click();}
$('#import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try {const data=JSON.parse(await f.text());if(!data||!Array.isArray(data.history)||!Array.isArray(data.plans)||!Array.isArray(data.favorites)){throw new Error('קובץ גיבוי לא תקין');}if(!confirm('לייבא גיבוי זה? הוא יחליף את נתוני Fitness Next הנוכחיים בגרסה זו.'))return;
 state={...defaults(),...data,session:null};if(data.version!=='0.4'){state.favorites=[...new Set([...curatedIds,...(state.favorites||[])])];state.myExercises=[...new Set([...curatedIds,...(Array.isArray(state.myExercises)?state.myExercises:[])])];if(state.selectedPlan==='full'||!planList().some(p=>p.id===state.selectedPlan))state.selectedPlan='fb';}state.favorites=state.favorites.filter(x=>allowedIds.has(x));state.myExercises=Array.isArray(state.myExercises)?[...new Set(state.myExercises.filter(x=>allowedIds.has(x)))]:[...defaults().myExercises];state.profile=(state.profile && typeof state.profile==='object')?state.profile:defaults().profile;state.equipment=Array.isArray(state.equipment)?state.equipment.filter(g=>allGears.includes(g)):[...allGears];state.plans=state.plans.filter(p=>p&&Array.isArray(p.ids)&&typeof p.name==='string').map(p=>({...p,ids:p.ids.filter(x=>allowedIds.has(x)),tags:p.tags&&typeof p.tags==='object'?p.tags:{}}));persist();screen={kind:'main'};tab='home';render();notify('הגיבוי יובא בהצלחה');}catch(err){notify('לא ניתן לייבא את הקובץ: '+err.message);}});
render();
setInterval(updateRest,500);

</script>
</body>
</html>
